name: test-release-nx.yml
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "main"

jobs:
  test-libraries:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - run: git config --global user.name "${{ github.actor }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          scope: 'telicent-oss'
          token: ${{ secrets.NPM_REGISTRY_TOKEN }}
      - run: LOCAL_MACHINE=false yarn install --frozen-lockfile
      - run: yarn build
      # Two packages commit their dist, because they are consumed from a git pin and
      # nothing compiles them on the way in. A release bumps package.json without
      # rebuilding, and the version is read into the bundle, so a stale dist ships a
      # version behind unless something compares the two.
      - run: yarn lerna run verify-dist
      - run: yarn test:ci