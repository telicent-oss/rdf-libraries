name: test-release-nx.yml
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "main"

jobs:
  test-libraries:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - run: git config --global user.name "${{ github.actor }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          scope: 'telicent-oss'
          token: ${{ secrets.NPM_REGISTRY_TOKEN }}
      - run: LOCAL_MACHINE=false yarn install --frozen-lockfile
      - run: yarn build
      # release-please bumps its registered packages - but doesn't publish certain private
      # packages to npmjs.org. For the unpublished, verify-dist rebuilds and compares
      # against the committed ./dist, so a version bump that didnt get a rebuild fails
      # the build.
      - run: yarn lerna run verify-dist
      - run: yarn test:ci