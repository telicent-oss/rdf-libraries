# Publishes packages whose npmjs.org names do not exist yet to GitHub Packages,
# so closed-source repos can consume them while npmjs.org name requests sit in
# a queue.
#
# INTERIM. When the npmjs.org names are provisioned, the packages move to
# publish-nx.yml and this whole file is deleted. Nothing else references it.
#
# Deliberately separate from publish-nx.yml: that workflow publishes to
# npmjs.org by trusted publishing (OIDC) and works, so it is left untouched.
#
# Dispatch-only, so it cannot run until this file reaches the default branch.
# That is deliberate: a push trigger here would also fire test-release-nx.yml,
# which runs on every branch but main, and the point was to add no CI noise.
name: publish-github-packages.yml

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish. Unchecked = pack only, no registry contact.'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write # publish to npm.pkg.github.com

jobs:
  publish-github-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Routes @telicent-oss to GitHub Packages for this run only, and
          # wires up NODE_AUTH_TOKEN below.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@telicent-oss'

      - run: corepack enable

      # No install step: both packages ship plain JS from src with no
      # dependencies and a no-op build, so pnpm needs only the workspace file
      # to resolve the filters. Fewer moving parts in the thing under test.

      # No auth probe: a GET against this registry returns 404 for an
      # unpublished name with a valid token, an invalid token, or no token at
      # all, so it cannot tell them apart. Publishing is the only test of
      # publish rights, and a dry run does not contact the registry for auth.

      - name: Publish
        run: ./scripts/publish-github-packages.sh
        env:
          # GITHUB_TOKEN can publish a package whose repository field names
          # this repo, so no PAT is needed on the publish side.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
